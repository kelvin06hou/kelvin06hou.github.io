<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Development - Travel Log</title>
  <!-- Link to your existing main stylesheet -->
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* Specific styles for the development notification page layout */
    .dev-container {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(to bottom, #fcfcfc, #f4f6f9);
    }

    .dev-status-box {
      max-width: 600px;
      background: #ffffff;
      padding: 50px 40px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(0, 0, 0, 0.02);
    }

    .dev-icon {
      font-size: 48px;
      margin-bottom: 24px;
      display: inline-block;
      animation: floatAnimation 3s ease-in-out infinite;
    }

    .dev-status-box h2 {
      font-size: 2rem;
      color: #2c3e50;
      margin-bottom: 16px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .dev-status-box p {
      color: #7f8c8d;
      font-size: 1.1rem;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .btn-back-home {
      display: inline-block;
      background: #2c3e50;
      color: #ffffff;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 50px;
      font-weight: 500;
      font-size: 0.95rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      box-shadow: 0 8px 20px rgba(44, 62, 80, 0.15);
    }

    .btn-back-home:hover {
      background: #1a252f;
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(44, 62, 80, 0.25);
    }

    @keyframes floatAnimation {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
  </style>
</head>
<body>

  <!-- The shared global navigation header will be automatically injected here by navbar-footer.js -->

  <main class="dev-container">
    <div class="dev-status-box">
      <div class="dev-icon">📌</div>
      <h2>Developing Memories</h2>
      <p>
        Thank you for stopping by! This specific travel collection is currently under development. 
        I am carefully organizing the photographs, writing the journal stories, and compiling the vlog clips to share this journey with you soon.
      </p>
      <a href="index.html" class="btn-back-home">Return to Home</a>
    </div>
  </main>

  <!-- The shared global footer (with your copyright and social links) will be automatically injected here by navbar-footer.js -->
  <script src="navbar-footer.js"></script>

</body>
</html>
