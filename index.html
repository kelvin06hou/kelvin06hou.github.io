<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  
  <style>
    /* Minimal styling to match your peaceful blog aesthetic during the delay */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
      background-color: #fcfcfc;
      color: #7f8c8d;
      margin: 0;
      text-align: center;
    }
    .redirect-box {
      padding: 20px;
    }
    /* Smooth style for the sentence containers */
    .redirect-message {
      font-size: 1.15rem;
      line-height: 1.8;
      margin-bottom: 24px;
    }
    /* Keep the countdown dynamic emphasis subtle and clean */
    .countdown-timer {
      font-weight: 600;
      color: #2c3e50;
      padding: 0 4px;
    }
    a {
      color: #2c3e50;
      text-decoration: underline;
    }
  </style>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      // Initialize the core countdown counter variable
      let secondsRemaining = 3;
      
      // Select both inline timer target span elements (English and Chinese)
      const timerEN = document.getElementById("timer-en");
      const timerZH = document.getElementById("timer-zh");

      // Setup a recurrent execution loop running exactly every 1000ms (1 second)
      const countdownInterval = setInterval(() => {
        secondsRemaining--; // Decrement the remaining counter value by 1
        
        if (secondsRemaining > 0) {
          // Update only the inner digits fluidly inside the sentences
          timerEN.textContent = secondsRemaining;
          timerZH.textContent = secondsRemaining;
        } else {
          // Clear the interval tracking node to free background memory space
          clearInterval(countdownInterval);
          
          // Execute an immediate, non-history-breaking document redirection
          window.location.replace("under-construction.html");
        }
      }, 1000);
    });
  </script>
</head>
<body>
  <div class="redirect-box">
    <!-- Combined inline text layout containers -->
    <div class="redirect-message">
      <p>The travel log is moving to its new home. You will be redirected automatically in <span id="timer-en" class="countdown-timer">3</span> sec...</p>
      <p>網誌正移至新首頁。系統將於 <span id="timer-zh" class="countdown-timer">3</span> 秒內自動重新導向...</p>
    </div>
    
    <p>If you are not redirected, please <a href="under-construction.html">click here</a>.</p>
  </div>
</body>
</html>
